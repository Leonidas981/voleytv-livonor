<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Voley_TV · Camino a la Final</title>
  <style>
    :root{
      color-scheme:dark;
      --bg:#07111d;
      --panel:rgba(9,18,31,.95);
      --panel2:rgba(16,30,49,.98);
      --line:rgba(108,231,255,.25);
      --cyan:#67e8ff;
      --cyan2:#2bb9ff;
      --lime:#d9ff5c;
      --gold:#ffd86a;
      --white:#f6fbff;
      --soft:#bdd5e8;
      --soft2:#7ea2bf;
      --shadow:0 20px 52px rgba(0,0,0,.45);
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:transparent!important;font-family:Arial,Helvetica,sans-serif;color:var(--white)}
    #stage{position:relative;width:100vw;height:100vh}
    .wrap{position:absolute;left:2.5%;bottom:3%;width:min(62vw,1120px)}
    .board{
      position:relative;
      border-radius:28px;
      overflow:hidden;
      background:linear-gradient(180deg, rgba(5,10,18,.97), rgba(9,18,31,.97));
      border:1px solid rgba(103,232,255,.28);
      box-shadow:var(--shadow);
      backdrop-filter:blur(8px);
    }
    .board::before{
      content:"";position:absolute;inset:0;pointer-events:none;
      background:
        radial-gradient(circle at 0% 0%, rgba(103,232,255,.18), transparent 24%),
        radial-gradient(circle at 100% 100%, rgba(43,185,255,.10), transparent 28%),
        linear-gradient(130deg, rgba(255,255,255,.03), transparent 33%);
    }
    .top{
      display:flex;align-items:center;justify-content:space-between;gap:16px;
      padding:16px 20px 12px 20px;
      background:linear-gradient(90deg, rgba(17,34,59,.96), rgba(8,16,28,.75));
      border-bottom:1px solid rgba(103,232,255,.18);
      position:relative;
    }
    .brand{display:flex;align-items:center;gap:12px;min-width:0}
    .brand-logo{width:48px;height:48px;border-radius:12px;object-fit:contain;background:#fff;padding:4px;border:1px solid rgba(255,255,255,.16)}
    .brand-text{display:flex;flex-direction:column;min-width:0}
    .brand-text strong{font-size:clamp(20px,1.85vw,34px);letter-spacing:1px;line-height:1}
    .brand-text strong span{color:var(--cyan)}
    .brand-text small{margin-top:5px;color:var(--soft);font-size:clamp(10px,.82vw,15px);letter-spacing:1.1px;text-transform:uppercase;white-space:nowrap}
    .live{font-size:clamp(9px,.74vw,14px);font-weight:900;letter-spacing:1.3px;text-transform:uppercase;color:#001019;background:var(--lime);border-radius:999px;padding:8px 12px;box-shadow:0 0 18px rgba(217,255,92,.22)}
    .headline{
      display:flex;align-items:flex-end;justify-content:space-between;gap:12px;
      padding:14px 20px 10px 20px;position:relative;
    }
    .headline h1{margin:0;font-size:clamp(21px,1.95vw,36px);line-height:1;text-transform:uppercase;letter-spacing:1.2px}
    .headline p{margin:6px 0 0 0;color:var(--soft);font-size:clamp(10px,.82vw,15px);text-transform:uppercase;letter-spacing:.9px}
    .headline .tag{font-size:clamp(11px,.84vw,15px);font-weight:900;text-transform:uppercase;color:#06121c;background:linear-gradient(90deg,var(--cyan),var(--cyan2));border-radius:999px;padding:10px 14px;white-space:nowrap}
    .meta{display:flex;gap:10px;flex-wrap:wrap;padding:0 20px 12px 20px}
    .pill{background:rgba(103,232,255,.08);border:1px solid rgba(103,232,255,.12);border-radius:14px;padding:8px 11px;min-width:100px}
    .pill b{display:block;font-size:clamp(12px,.95vw,18px)}
    .pill span{display:block;color:var(--soft2);font-size:clamp(9px,.68vw,12px);text-transform:uppercase;letter-spacing:.8px}
    .match-list{display:grid;gap:12px;padding:0 16px 16px 16px}
    .match{
      display:grid;grid-template-columns:110px 1fr 64px 1fr;
      align-items:center;gap:12px;
      padding:14px 16px;
      border-radius:22px;
      background:linear-gradient(180deg, rgba(18,35,58,.98), rgba(12,24,39,.98));
      border:1px solid rgba(103,232,255,.12);
      position:relative;overflow:hidden;
    }
    .match::after{
      content:"";position:absolute;inset:0;pointer-events:none;
      background:linear-gradient(90deg, rgba(103,232,255,.04), transparent 30%, transparent 70%, rgba(255,216,106,.04));
    }
    .slot{display:flex;flex-direction:column;gap:6px;align-items:flex-start;justify-content:center}
    .slot .time{font-size:clamp(18px,1.35vw,26px);font-weight:900;color:var(--gold);line-height:1}
    .slot .stage{font-size:clamp(9px,.68vw,12px);font-weight:800;color:var(--soft2);text-transform:uppercase;letter-spacing:.8px}
    .side{display:flex;align-items:center;gap:12px;min-width:0}
    .side.right{justify-content:flex-end;text-align:right}
    .logo{width:56px;height:56px;flex:0 0 56px;border-radius:50%;object-fit:contain;background:#fff;padding:4px;border:1px solid rgba(255,255,255,.16);box-shadow:0 0 0 1px rgba(103,232,255,.08) inset}
    .name-block{min-width:0}
    .team{display:block;font-size:clamp(18px,1.42vw,28px);font-weight:900;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .seed{display:block;margin-top:4px;color:var(--soft2);font-size:clamp(9px,.68vw,12px);text-transform:uppercase;letter-spacing:.8px}
    .vs{display:flex;align-items:center;justify-content:center;height:58px;border-radius:18px;background:linear-gradient(180deg, rgba(103,232,255,.14), rgba(43,185,255,.06));border:1px solid rgba(103,232,255,.18);font-size:clamp(16px,1.1vw,21px);font-weight:900;color:var(--cyan)}
    .footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px 16px 16px;border-top:1px solid rgba(103,232,255,.12);background:linear-gradient(90deg, rgba(8,15,25,.96), rgba(8,15,25,.72))}
    .footnote{color:var(--soft);font-size:clamp(9px,.72vw,13px);line-height:1.35}
    .status{font-size:clamp(10px,.74vw,14px);font-weight:900;text-transform:uppercase;color:#001019;background:linear-gradient(90deg,var(--gold),#ffeeb5);padding:8px 12px;border-radius:999px;white-space:nowrap}
    .empty{padding:40px 20px;text-align:center;color:var(--soft);font-size:clamp(16px,1.2vw,24px)}
    @media (max-width:1100px){
      .wrap{width:74vw;left:2%;bottom:2%}
      .board{border-radius:20px}
      .top{padding:10px 12px 8px 12px}
      .brand-logo{width:34px;height:34px;border-radius:9px}
      .headline{padding:10px 12px 8px 12px}
      .meta{padding:0 12px 8px 12px;gap:6px}
      .match-list{padding:0 8px 10px 8px;gap:8px}
      .match{grid-template-columns:70px 1fr 32px 1fr;padding:10px 10px 12px 10px;border-radius:14px;gap:8px}
      .logo{width:38px;height:38px;flex-basis:38px}
      .vs{height:38px;border-radius:12px}
      .footer{padding:8px 10px 10px 10px}
    }
  </style>
</head>
<body>
<div id="stage"><div class="wrap"><div id="output"></div></div></div>
<script>
"use strict";
const API_URL = "https://script.google.com/macros/s/AKfycbwkW3nO8wjdHcunp1UGPmLxJstcCuExysfwflVxuFYRtCU8vzSSFyiyQ_KE92OseXSIOQ/exec";
const INTERVALO_MS = 20000;
const ESPERA_MAX_MS = 15000;
const preview = new URLSearchParams(window.location.search).get('demo') === '1';
const LOGO_BASE = 'logos/';
const TEAM_LOGOS = {
  'PLANETA': 'planeta.png',
  'JOGA': 'joga.png',
  'VOSTERH': 'vosterh.png',
  'PANTHERS': 'panthers.png',
  'CUMBRES A': 'cumbres.png',
  'ALGARROBO': 'algarrobo.png',
  'HUASCO': 'huasco.png'
};
const BRAND_LOGO = LOGO_BASE + 'voleytv.png';
const SAMPLE = {
  finished:9,total:21,invalid:0,checkedAt:'30/10 11:45',projections:true,tieWarning:true,
  pairings:[
    {time:'11:00',a:'CUMBRES A',b:'ALGARROBO',duel:'5.º vs 6.º'},
    {time:'12:00',a:'VOSTERH',b:'PANTHERS',duel:'3.º vs 4.º'},
    {time:'13:00',a:'PLANETA',b:'JOGA',duel:'1.º vs 2.º'}
  ]
};
const output = document.getElementById('output');
let ultimoDato = null, solicitudActiva = null, timerRefresco = null;
const escapeHtml = x => String(x == null ? '' : x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function logoTag(name){
  const file = TEAM_LOGOS[name];
  if (!file) return '';
  return `<img class="logo" src="${LOGO_BASE + file}" alt="${escapeHtml(name)}" onerror="this.style.display='none'">`;
}
function stageLabel(index){ return index===0 ? '5.º vs 6.º' : index===1 ? '3.º vs 4.º' : 'Final'; }

function header(data){
  return `
    <div class="top">
      <div class="brand">
        <img class="brand-logo" src="${BRAND_LOGO}" alt="Voley_TV" onerror="this.style.display='none'">
        <div class="brand-text">
          <strong>VOLEY<span>_TV</span></strong>
          <small>LIVONOR Salamanca 2026 · Damas U12 A</small>
        </div>
      </div>
      <div class="live">Proyección en vivo</div>
    </div>
    <div class="headline">
      <div>
        <h1>Camino a la final</h1>
        <p>Definiciones del domingo 01 de noviembre</p>
      </div>
      <div class="tag">Versión especial</div>
    </div>
    <div class="meta">
      <div class="pill"><b>${escapeHtml(String(data.finished))}/${escapeHtml(String(data.total))}</b><span>Partidos ingresados</span></div>
      <div class="pill"><b>3 cruces</b><span>Domingo 01/11</span></div>
      <div class="pill"><b>${escapeHtml(data.checkedAt || '--')}</b><span>Última revisión</span></div>
    </div>`;
}
function footer(data){
  const note = data.tieWarning ? 'Cruces proyectados sujetos a criterios oficiales de desempate.' : 'Cruces actualizados automáticamente desde Google Sheets.';
  return `<div class="footer"><div class="footnote">${escapeHtml(note)}</div><div class="status">Voley_TV · Finales</div></div>`;
}
function render(d){
  if (!d || !Array.isArray(d.pairings)) { mostrarAviso('Respuesta inesperada del sistema de cruces.'); return; }
  const rows = d.pairings.map((p,i)=>`
    <div class="match">
      <div class="slot"><div class="time">${escapeHtml(p.time)}</div><div class="stage">${escapeHtml(stageLabel(i))}</div></div>
      <div class="side">${logoTag(p.a)}<div class="name-block"><span class="team">${escapeHtml(p.a)}</span><span class="seed">${i===0?'5.º clasificado':i===1?'3.º clasificado':'1.º clasificado'}</span></div></div>
      <div class="vs">VS</div>
      <div class="side right"><div class="name-block"><span class="team">${escapeHtml(p.b)}</span><span class="seed">${i===0?'6.º clasificado':i===1?'4.º clasificado':'2.º clasificado'}</span></div>${logoTag(p.b)}</div>
    </div>`).join('');
  output.innerHTML = `<div class="board">${header(d)}<div class="match-list">${rows || '<div class="empty">Aún no hay cruces disponibles</div>'}</div>${footer(d)}</div>`;
}
function mostrarAviso(mensaje){
  if (ultimoDato) return;
  output.innerHTML = `<div class="board">${header({finished:'--',total:'--',checkedAt:'--'})}<div class="empty">${escapeHtml(mensaje)}</div>${footer({tieWarning:true})}</div>`;
}
function programarRefresco(){ clearTimeout(timerRefresco); timerRefresco = setTimeout(consultar, INTERVALO_MS); }
function terminarSolicitud(){ if (!solicitudActiva) return; clearTimeout(solicitudActiva.timer); solicitudActiva.script.remove(); solicitudActiva = null; programarRefresco(); }
window.voleyTvRecibe = function(data){
  if (!solicitudActiva) return;
  if (data && Array.isArray(data.pairings)) { ultimoDato = data; render(data); }
  else mostrarAviso('La respuesta de datos está incompleta.');
  terminarSolicitud();
};
function consultar(){
  if (solicitudActiva) return;
  const script = document.createElement('script');
  solicitudActiva = {script, timer:null};
  script.async = true;
  script.src = API_URL + '?api=datos&v=' + Date.now();
  script.onerror = function(){ mostrarAviso('No se pudo consultar Google Sheets. Se reintentará.'); terminarSolicitud(); };
  solicitudActiva.timer = setTimeout(function(){ mostrarAviso('Tiempo de espera agotado. Se reintentará.'); terminarSolicitud(); }, ESPERA_MAX_MS);
  document.head.appendChild(script);
}
if (preview) render(SAMPLE); else { mostrarAviso('Conectando con los cruces…'); consultar(); }
</script>
</body>
</html>
